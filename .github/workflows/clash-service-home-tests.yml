name: C.L.A.S.H. service-home regression

on:
  pull_request:
    branches:
      - main
      - fix/player-hal-job-routing-state-v1
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  service-home:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run service-home resolver regression
        run: python -m pytest -q tests/test_service_home_resolver.py
