name: Apply V6 logistics handoff hardening

on:
  push:
    branches:
      - agent/v6-logistics-handoff-hardening

permissions:
  contents: write

concurrency:
  group: v6-logistics-handoff-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-logistics-handoff-hardening
      - name: Apply logistics handoff patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mission = Path('13715765820790864929_legacy')
          attack_path = mission / 'ITW_Attack.sqf'
          patch_path = mission / 'ITW_CLASH_RuntimePatch.sqf'

          raw = patch_path.read_bytes()
          text = raw.decode('utf-8')
          nl = '\r\n' if b'\r\n' in raw else '\n'

          seam = f'ITW_CLASH_ReconstitutionTransitVersion = 1;{nl}'
          replacement = (
              f'ITW_CLASH_ReconstitutionTransitVersion = 1;{nl}'
              f'ITW_CLASH_LogisticsHandoffVersion = 1;{nl}'
              f'ITW_CLASH_WithdrawalArrivalRadius = 150;{nl}'
              f'ITW_CLASH_PostTransportSettle = 30;{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one runtime version seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          seam = f'    private _result = [_group] call ITW_CLASH_fnc_ClassifyGroup_V6Base;{nl}'
          replacement = (
              f'    private _settleUntil = if (isNull _group) then {{0}} else {{{nl}'
              f'        _group getVariable ["ITW_CLASH_PostTransportUntil",0]{nl}'
              f'    }};{nl}'
              f'    if (_settleUntil > time) exitWith {{{nl}'
              f'        [false,"post-transport-settle",[{nl}'
              f'            ceil (_settleUntil - time),{nl}'
              f'            VAR_GET_OBJ_IDX(_group){nl}'
              f'        ]]{nl}'
              f'    }};{nl}'
              f'    if (_settleUntil > 0 && {{!isNull _group}}) then {{{nl}'
              f'        _group setVariable ["ITW_CLASH_PostTransportUntil",nil];{nl}'
              f'    }};{nl}{nl}'
              f'    private _result = [_group] call ITW_CLASH_fnc_ClassifyGroup_V6Base;{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one classifier seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          ready = (
              f'diag_log format [{nl}'
              f'    "CLASH BOOT | reconstitution-transit-ready | version=%1",{nl}'
              f'    ITW_CLASH_ReconstitutionTransitVersion{nl}'
              f'];{nl}'
          )
          ready_repl = ready + (
              f'diag_log format [{nl}'
              f'    "CLASH BOOT | logistics-handoff-ready | version=%1 egress=%2 settle=%3",{nl}'
              f'    ITW_CLASH_LogisticsHandoffVersion,{nl}'
              f'    ITW_CLASH_WithdrawalArrivalRadius,{nl}'
              f'    ITW_CLASH_PostTransportSettle{nl}'
              f'];{nl}'
          )
          if text.count(ready) != 1:
              raise SystemExit(f'expected one ready-log seam, found {text.count(ready)}')
          text = text.replace(ready, ready_repl, 1)
          patch_path.write_bytes(text.encode('utf-8'))

          raw = attack_path.read_bytes()
          text = raw.decode('utf-8')
          nl = '\r\n' if b'\r\n' in raw else '\n'

          seam = (
              f'    if (!isServer || {{isNull _group}}) exitWith {{false}};{nl}'
              f'    if (ITW_AtkReconstitutionTransportContext isEqualTo []) exitWith {{false}};{nl}'
          )
          replacement = (
              f'    if (!isServer || {{isNull _group}}) exitWith {{false}};{nl}'
              f'    private _existingTransit = _group getVariable [{nl}'
              f'        "ITW_CLASH_TransitVehicle",objNull{nl}'
              f'    ];{nl}'
              f'    if (!isNull _existingTransit && {{alive _existingTransit}}) exitWith {{{nl}'
              f'        _group setVariable ["ITW_CLASH_TransitState","transport"];{nl}'
              f'        true{nl}'
              f'    }};{nl}'
              f'    if (ITW_AtkReconstitutionTransportContext isEqualTo []) exitWith {{false}};{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one dispatch guard seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          seam = (
              f'            _objectiveIndex = _group getVariable [{nl}'
              f'                "ITW_CLASH_TransitObjective",_objectiveIndex{nl}'
              f'            ];{nl}'
          )
          replacement = (
              f'            _state = _group getVariable [{nl}'
              f'                "ITW_CLASH_TransitState",_state{nl}'
              f'            ];{nl}'
              f'            _objectiveIndex = _group getVariable [{nl}'
              f'                "ITW_CLASH_TransitObjective",_objectiveIndex{nl}'
              f'            ];{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one authoritative-state seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          seam = (
              f'            if (!_inVehicle && {{{nl}'
              f'                _state in ["transport","walking"] && {{{nl}'
              f'                    _distance <= _handoffRadius{nl}'
              f'                }}{nl}'
              f'            }}) then {{{nl}'
              f'                _group setVariable ["ITW_CLASH_ReconstitutionTransit",nil];{nl}'
          )
          replacement = (
              f'            if (!_inVehicle && {{{nl}'
              f'                _state in ["transport","walking"] && {{{nl}'
              f'                    _distance <= _handoffRadius{nl}'
              f'                }}{nl}'
              f'            }}) then {{{nl}'
              f'                {{unassignVehicle _x}} forEach _aliveUnits;{nl}'
              f'                _group setVariable ["ITW_CLASH_ReconstitutionTransit",nil];{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one reconstitution handoff seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          seam = (
              f'                        [_isFriendly,true] call ITW_AtkTranspSuccess;{nl}'
              f'                        _vehInfo set [VEHINFO_CARGO_GRPS,[]];{nl}'
          )
          replacement = (
              f'                        [_isFriendly,true] call ITW_AtkTranspSuccess;{nl}'
              f'                        private _settleFor = missionNamespace getVariable [{nl}'
              f'                            "ITW_CLASH_PostTransportSettle",30{nl}'
              f'                        ];{nl}'
              f'                        {{{nl}'
              f'                            if (!isNull _x) then {{{nl}'
              f'                                _x setVariable [{nl}'
              f'                                    "ITW_CLASH_PostTransportUntil",{nl}'
              f'                                    time + _settleFor{nl}'
              f'                                ];{nl}'
              f'                                if (!isNil "ITW_CLASH_fnc_Log") then {{{nl}'
              f'                                    ["transport-handoff-settle",[{nl}'
              f'                                        str _x,VAR_GET_OBJ_IDX(_x),{nl}'
              f'                                        round _settleFor,typeOf _veh{nl}'
              f'                                    ]] call ITW_CLASH_fnc_Log;{nl}'
              f'                                }};{nl}'
              f'                            }};{nl}'
              f'                        }} forEach _cargoGroups;{nl}'
              f'                        _vehInfo set [VEHINFO_CARGO_GRPS,[]];{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one normal unload seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          seam = (
              f'                        if !(_grpsNoLongerInVeh isEqualTo []) then {{{nl}'
              f'                            _cargoGroups = _cargoGroups - _grpsNoLongerInVeh;{nl}'
          )
          replacement = (
              f'                        if !(_grpsNoLongerInVeh isEqualTo []) then {{{nl}'
              f'                            private _settleFor = missionNamespace getVariable [{nl}'
              f'                                "ITW_CLASH_PostTransportSettle",30{nl}'
              f'                            ];{nl}'
              f'                            {{{nl}'
              f'                                _x setVariable [{nl}'
              f'                                    "ITW_CLASH_PostTransportUntil",{nl}'
              f'                                    time + _settleFor{nl}'
              f'                                ];{nl}'
              f'                            }} forEach _grpsNoLongerInVeh;{nl}'
              f'                            _cargoGroups = _cargoGroups - _grpsNoLongerInVeh;{nl}'
          )
          if text.count(seam) != 1:
              raise SystemExit(f'expected one early-dismount seam, found {text.count(seam)}')
          text = text.replace(seam, replacement, 1)

          overshoot = (
              f'                        private _wp2 = _grp addWaypoint [_fromPos getPos [1000,getPosATL _veh getDir _fromPos],0];{nl}'
              f'                        _wp2 setWaypointType "MOVE";{nl}'
              f'                        _wp2 setWaypointCompletionRadius 210;{nl}'
          )
          if text.count(overshoot) != 1:
              raise SystemExit(f'expected one 1km RTB overshoot block, found {text.count(overshoot)}')
          text = text.replace(overshoot, '', 1)
          attack_path.write_bytes(text.encode('utf-8'))

          test = '''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
MISSION = ROOT / "13715765820790864929_legacy"


def text(name: str) -> str:
    return (MISSION / name).read_text(encoding="utf-8")


def test_withdrawal_arrival_radius_is_150m():
    source = text("ITW_CLASH_RuntimePatch.sqf")
    assert "ITW_CLASH_WithdrawalArrivalRadius = 150;" in source
    assert "logistics-handoff-ready" in source


def test_unloaded_groups_receive_post_transport_quarantine():
    source = text("ITW_Attack.sqf")
    assert source.count('"ITW_CLASH_PostTransportUntil"') >= 2
    assert '"ITW_CLASH_PostTransportSettle",30' in source
    patch = text("ITW_CLASH_RuntimePatch.sqf")
    assert '"post-transport-settle"' in patch
    assert 'ITW_CLASH_PostTransportSettle = 30;' in patch


def test_land_transport_rtb_has_no_one_km_overshoot_waypoint():
    source = text("ITW_Attack.sqf")
    assert '_fromPos getPos [1000,getPosATL _veh getDir _fromPos]' not in source
    assert 'private _wp1 = _grp addWaypoint [_fromPos,0];' in source
    assert '_wp1 setWaypointCompletionRadius 220;' in source


def test_reconstitution_transport_cannot_duplicate_live_lift():
    source = text("ITW_Attack.sqf")
    assert '"ITW_CLASH_TransitVehicle",objNull' in source
    assert 'if (!isNull _existingTransit && {alive _existingTransit}) exitWith {' in source


def test_transit_manager_uses_group_state_as_authority():
    source = text("ITW_Attack.sqf")
    assert '"ITW_CLASH_TransitState",_state' in source
    assert '{unassignVehicle _x} forEach _aliveUnits;' in source


def test_reconstitution_transit_behavior_remains_present():
    source = text("ITW_Attack.sqf")
    assert "ITW_AtkBeginReconstitutionTransit" in source
    assert "ITW_AtkDispatchReconstitutionTransport" in source
'''
          Path('tests/test_logistics_handoff.py').write_text(test, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q
          git -c core.whitespace=cr-at-eol diff --check -- \
            13715765820790864929_legacy/ITW_Attack.sqf \
            13715765820790864929_legacy/ITW_CLASH_RuntimePatch.sqf \
            tests/test_logistics_handoff.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "C.L.A.S.H. Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 13715765820790864929_legacy/ITW_Attack.sqf \
                  13715765820790864929_legacy/ITW_CLASH_RuntimePatch.sqf \
                  tests/test_logistics_handoff.py
          git commit -m "Harden egress and transport handoff"
          git push origin HEAD:agent/v6-logistics-handoff-hardening
