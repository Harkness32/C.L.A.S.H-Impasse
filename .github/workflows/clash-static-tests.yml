name: C.L.A.S.H. static regressions

on:
  pull_request:
    branches:
      - main
      - fix/player-hal-job-routing-state-v1
      - fix/player-job-cancel-hardening-v1
  push:
    branches:
      - "agent/**"
      - "feature/**"
      - "opfor-fob-logic"

permissions:
  contents: read

jobs:
  clash-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run C.L.A.S.H. regression assertions
        run: >-
          python -m pytest -q
          tests/test_big_test_followup.py
          tests/test_one_zero_burnin.py
          tests/test_dual_hal_checkbook.py
          tests/test_dual_hal_runtime_bind.py
          tests/test_support_lifecycle.py
          tests/test_support_authority_hardening.py
          tests/test_hal_transport_audio.py
          tests/test_player_job_state_hardening.py
          tests/test_player_job_cancel_certification.py
          tests/test_player_logistics_provider_compat.py
          tests/test_player_task_sling_transport.py
          tests/test_hal_logistics_fulfillment_hardening.py
          tests/test_spawn_type_guard.py
          tests/test_ground_medevac.py
          tests/test_casevac.py
          tests/test_front_routing_phase0.py
          tests/test_player_artillery_tasking.py
          tests/test_player_artillery_side_marker.py
          tests/test_player_demand_dispatch.py
          tests/test_player_demand_native_takeover_policy.py
          tests/test_player_task_requests.py
          tests/test_player_task_request_native_contract.py
          tests/test_player_task_request_strike_recon.py
          tests/test_player_task_request_strike_classifier_v2.py
          tests/test_blufor_reconstitution.py
