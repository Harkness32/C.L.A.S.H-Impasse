name: Apply V6 transport patch on PR open

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: v6-reconstitution-transport-pr
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v6-reconstitution-transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-reconstitution-transport
      - name: Extract and apply validated transport patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          src = Path('.github/workflows/apply-v6-transport.yml').read_text()
          m = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d > /tmp/apply_v6_transport.py", src)
          if not m:
              raise SystemExit('embedded transport patch payload not found')
          Path('/tmp/apply_v6_transport.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          python /tmp/apply_v6_transport.py
      - name: Validate
        shell: bash
        run: |
          PYTHONPATH=. pytest -q
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "C.L.A.S.H. Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 13715765820790864929_legacy/ITW_Attack.sqf \
                  13715765820790864929_legacy/ITW_Enemy.sqf \
                  13715765820790864929_legacy/ITW_CLASH_RuntimePatch.sqf \
                  tests/test_reconstitution_transport.py
          git commit -m "Add reconstitution transport lifecycle"
          git push origin HEAD:agent/v6-reconstitution-transport
