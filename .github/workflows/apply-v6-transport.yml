name: Apply V6 reconstitution transport

on:
  push:
    branches:
      - agent/v6-reconstitution-transport
    paths:
      - .github/transport-trigger

permissions:
  contents: write

concurrency:
  group: v6-reconstitution-transport
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-reconstitution-transport
      - name: Apply transport lifecycle patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_v6_transport.py
          python /tmp/apply_v6_transport.py
      - name: Validate
        shell: bash
        run: |
          PYTHONPATH=. pytest -q
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "C.L.A.S.H. Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 13715765820790864929_legacy/ITW_Attack.sqf \
                  13715765820790864929_legacy/ITW_Enemy.sqf \
                  13715765820790864929_legacy/ITW_CLASH_RuntimePatch.sqf \
                  tests/test_reconstitution_transport.py
          git commit -m "Add reconstitution transport lifecycle"
          git push origin HEAD:agent/v6-reconstitution-transport
