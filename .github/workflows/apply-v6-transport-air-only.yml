name: Harden V6 air-only reconstitution transit

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'agent/v6-reconstitution-transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-reconstitution-transport
      - name: Restrict air-only corridors to air lift
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('13715765820790864929_legacy/ITW_Attack.sqf')
          raw = path.read_bytes()
          text = raw.decode('utf-8')
          nl = '\r\n' if b'\r\n' in raw else '\n'

          old = f'    private _ordered = _preferred + (_candidates - _preferred);{nl}'
          new = (
              f'    private _ordered = if (_airRoute) then {{{nl}'
              f'        +_preferred{nl}'
              f'    }} else {{{nl}'
              f'        _preferred + (_candidates - _preferred){nl}'
              f'    }};{nl}'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one transport ordering seam, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = f'                    if (time - _createdAt >= ITW_AtkReconstitutionTransportWait) then {{{nl}'
          new = (
              f'                    private _corridor = [{nl}'
              f'                        _objectiveIndex{nl}'
              f'                    ] call ITW_CLASH_fnc_GetSupportCorridorSpawn;{nl}'
              f'                    private _airOnly = _corridor isNotEqualTo [] && {{{nl}'
              f'                        ((_corridor#2) find "support-corridor-air") == 0{nl}'
              f'                    }};{nl}'
              f'                    if (!_airOnly && {{{nl}'
              f'                        time - _createdAt >= ITW_AtkReconstitutionTransportWait{nl}'
              f'                    }}) then {{{nl}'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one walking fallback seam, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_bytes(text.encode('utf-8'))
          PY
      - name: Validate
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q
          git -c core.whitespace=cr-at-eol diff --check -- \
            13715765820790864929_legacy/ITW_Attack.sqf \
            tests/test_reconstitution_transport.py
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "C.L.A.S.H. Patch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 13715765820790864929_legacy/ITW_Attack.sqf
          git commit -m "Harden air-only reconstitution transit"
          git push origin HEAD:agent/v6-reconstitution-transport
